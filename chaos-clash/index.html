<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chaos Clash 3D</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#10111d;color:#fff;font-family:system-ui,sans-serif;padding:16px}#game{width:min(100%,980px);position:relative;border:3px solid #6373bd;border-radius:18px;overflow:hidden;box-shadow:0 25px 80px #000}canvas{display:block;width:100%;aspect-ratio:16/9}.back{position:absolute;top:12px;left:14px;color:#fff;text-decoration:none;font-weight:800;z-index:2}.hud{position:absolute;top:11px;left:0;width:100%;display:flex;justify-content:center;gap:210px;text-align:center;font-weight:900;text-shadow:0 2px 4px #000}.small{display:block;font-size:11px;color:#dce4ff}.tip{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);background:#15182bdc;border:1px solid #788ae1;border-radius:10px;padding:8px 14px;font-weight:800;white-space:nowrap}.cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#090a14dc;z-index:3}.box{max-width:540px;background:#202548;border:2px solid #8699ef;border-radius:17px;padding:26px}.box h1{margin:0;color:#ffe56d;font-size:clamp(35px,7vw,60px);line-height:.9}.box p{line-height:1.55}.box button{border:0;border-radius:10px;padding:13px 25px;color:#192043;background:#ffe56d;font-weight:900;font-size:16px;cursor:pointer}</style></head><body><main id="game"><a class="back" href="../index.html">← Games</a><div class="hud"><div><span class="small">BLUE · WASD · F PUNCH · G GRAB</span><b id="blue">0</b></div><div><span class="small">RED · ARROWS · / PUNCH · . GRAB</span><b id="red">0</b></div></div><canvas id="c" width="960" height="540"></canvas><div id="tip" class="tip">Punch or grab your rival—do not fall off!</div><div id="cover" class="cover"><div class="box"><h1>CHAOS<br>CLASH 3D</h1><p>An original wobbly 3D-style arena brawler. Knock your rival off the platform to score.</p><button id="start">START FIGHT</button></div></div></main><script>
'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),keys={},blueEl=document.getElementById('blue'),redEl=document.getElementById('red'),W=960,H=540;let p,blue=0,red=0,live=false,last=0,msg='',timer=0;
function guy(x,z,color,face){return{x,z,y:0,vx:0,vz:0,vy:0,color,face,punch:0,grab:0,stun:0,tilt:0}}function reset(){p=[guy(-2,0,'#51cfff',1),guy(2,0,'#ff6883',-1)];msg='FIGHT!';timer=.8}function proj(a,b,h=0){return{x:W/2+a*105,y:310+b*54-h*76}}function action(i,type){if(!live)return;let a=p[i],b=p[1-i],d=Math.hypot(a.x-b.x,a.z-b.z);if(type==='p'&&a.punch<=0){a.punch=.27;if(d<1.25){b.vx+=(b.x-a.x)/d*6;b.vz+=(b.z-a.z)/d*6;b.vy=4;b.stun=.45;b.tilt+=(b.x-a.x)*.35}}if(type==='g'&&a.grab<=0){a.grab=.75;if(d<1.05){b.vx=a.vx*1.5+(b.x-a.x)*2;b.vz=a.vz*1.5+(b.z-a.z)*2;b.stun=.7}}}
function control(a,i,dt){let L=i?keys.arrowleft:keys.a,R=i?keys.arrowright:keys.d,U=i?keys.arrowup:keys.w,D=i?keys.arrowdown:keys.s,dx=(L?-1:0)+(R?1:0),dz=(U?-1:0)+(D?1:0);if(dx||dz){let n=Math.hypot(dx,dz);a.face=Math.atan2(dz/n,dx/n);if(!a.stun){a.vx+=dx/n*13*dt;a.vz+=dz/n*13*dt}}a.punch=Math.max(0,a.punch-dt);a.grab=Math.max(0,a.grab-dt);a.stun=Math.max(0,a.stun-dt);a.vx*=Math.pow(.84,dt*60);a.vz*=Math.pow(.84,dt*60);a.vy-=12*dt;a.x+=a.vx*dt;a.z+=a.vz*dt;a.y+=a.vy*dt;if(a.y<0){a.y=0;a.vy=0}a.tilt*=Math.pow(.85,dt*60)}function update(dt){if(!live)return;control(p[0],0,dt);control(p[1],1,dt);for(let i=0;i<2;i++)if(Math.abs(p[i].x)>4.75||Math.abs(p[i].z)>3.6||p[i].y<-2){if(i===0)red++;else blue++;blueEl.textContent=blue;redEl.textContent=red;msg=i?'BLUE KNOCKOUT!':'RED KNOCKOUT!';live=false;setTimeout(()=>{reset();live=true},950)}timer=Math.max(0,timer-dt);if(!timer)msg=''}
function platform(){let q=[proj(-5,-4),proj(5,-4),proj(5,4),proj(-5,4)],top=[proj(-4.8,-3.7),proj(4.8,-3.7),proj(4.8,3.7),proj(-4.8,3.7)];x.fillStyle='#19213f';x.beginPath();x.moveTo(q[0].x,q[0].y);for(let i=1;i<4;i++)x.lineTo(q[i].x,q[i].y);x.fill();x.fillStyle='#4f65aa';x.beginPath();x.moveTo(top[0].x,top[0].y);for(let i=1;i<4;i++)x.lineTo(top[i].x,top[i].y);x.fill();x.strokeStyle='#abbcff';x.lineWidth=3;x.stroke()}function drawGuy(a){let q=proj(a.x,a.z,a.y),r=proj(a.x,a.z,0),s=1+a.z*.035;x.save();x.translate(q.x,q.y);x.rotate(a.tilt);x.fillStyle='#10172f';x.beginPath();x.ellipse(0,26*s,24*s,8*s,0,0,6.3);x.fill();x.fillStyle=a.color;x.fillRect(-14*s,-25*s,28*s,39*s);x.fillStyle='#f1c19d';x.beginPath();x.arc(0,-39*s,16*s,0,6.3);x.fill();x.fillStyle='#19203e';x.fillRect(-17*s,-50*s,34*s,7*s);let arm=a.punch>.05?34:20,ang=a.face;for(let side of [-1,1]){let ex=Math.cos(ang)*arm+Math.cos(ang+1.57)*side*13,ey=Math.sin(ang)*arm+Math.sin(ang+1.57)*side*7;x.strokeStyle=a.color;x.lineWidth=10*s;x.lineCap='round';x.beginPath();x.moveTo(side*10*s,-18*s);x.lineTo(ex,ey-10*s);x.stroke()}if(a.grab){x.strokeStyle='#ffe873';x.lineWidth=4;x.beginPath();x.arc(0,-3,30,0,6.3);x.stroke()}x.restore()}function draw(){let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#252553');g.addColorStop(1,'#080914');x.fillStyle=g;x.fillRect(0,0,W,H);for(let i=0;i<35;i++){x.fillStyle='#b2c3ff';x.globalAlpha=.4;x.fillRect((i*139)%W,(i*71)%250,2,2)}x.globalAlpha=1;platform();let order=[...p].sort((a,b)=>a.z-b.z);for(const a of order)drawGuy(a);if(msg){x.font='900 44px system-ui';x.textAlign='center';x.fillStyle='#ffe873';x.strokeStyle='#1b2149';x.lineWidth=8;x.strokeText(msg,W/2,130);x.fillText(msg,W/2,130)}}function loop(t){let dt=Math.min(.03,(t-last||t)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}document.getElementById('start').onclick=()=>{document.getElementById('cover').style.display='none';reset();live=true};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='f'||e.key==='F')action(0,'p');if(e.key==='g'||e.key==='G')action(0,'g');if(e.key==='/')action(1,'p');if(e.key==='.')action(1,'g')});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);reset();requestAnimationFrame(loop);
</script></body></html>
