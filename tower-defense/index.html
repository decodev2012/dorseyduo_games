<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Last Light Defense</title>
<style>
  *{box-sizing:border-box} body{margin:0;min-height:100vh;background:#08131a;color:#e8f5e9;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:18px}
  #game{width:min(100%,1050px);background:#10232a;border:1px solid #2a525b;border-radius:16px;overflow:hidden;box-shadow:0 22px 70px #0009;position:relative}
  header{height:62px;display:flex;align-items:center;gap:18px;padding:10px 18px;background:#0c1b22;border-bottom:1px solid #24454e;position:relative;z-index:2}
  h1{font-size:18px;letter-spacing:1px;margin:0;color:#f7e9a7;white-space:nowrap}.stats{display:flex;gap:18px;flex:1;justify-content:flex-end;font-weight:700}.stat{color:#9ec5cb}.stat b{color:#fff}.coin{color:#ffd45a}.heart{color:#ff7373}
  .back{color:#83bfc7;text-decoration:none;font-size:14px}.back:hover{color:#fff} #field{display:block;width:100%;aspect-ratio:16/9;background:#173e35;cursor:crosshair;touch-action:none}#enemyLayer{position:absolute;top:62px;left:0;width:100%;aspect-ratio:16/9;pointer-events:none;overflow:hidden;z-index:3}.enemy-dot{position:absolute;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);background:#b6ef54;border:3px solid #10231d;box-shadow:0 0 16px #b6ef54;transition:left .025s linear,top .025s linear}.enemy-dot::before,.enemy-dot::after{content:'';position:absolute;width:4px;height:4px;border-radius:50%;background:#10231d;top:8px}.enemy-dot::before{left:6px}.enemy-dot::after{right:6px}.enemy-dot.boss{width:40px;height:40px;background:#c878ff;box-shadow:0 0 20px #c878ff}.enemy-dot.slow{background:#9cf4ff;box-shadow:0 0 16px #9cf4ff}
  #bottom{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#0c1b22;border-top:1px solid #24454e;min-height:86px}.tower{border:1px solid #35606a;background:#163139;border-radius:9px;padding:8px 12px;color:#e9f6ee;cursor:pointer;min-width:116px;text-align:left;transition:.15s}.tower:hover,.tower.selected{border-color:#ffd45a;background:#24444a;transform:translateY(-2px)}.tower[disabled]{opacity:.45;cursor:not-allowed;transform:none}.tower strong{display:block;font-size:14px}.tower small{color:#9fc0c4}.tower em{font-style:normal;color:#ffd45a;font-weight:700}
  #wave{margin-left:auto;padding:10px 16px;border:0;border-radius:8px;background:#d45a3d;color:white;font-weight:800;cursor:pointer;font-size:14px}#wave:hover{background:#ee704f}#wave:disabled{opacity:.45;cursor:not-allowed}.hint{font-size:12px;color:#84a7aa;max-width:175px;line-height:1.25}
  #overlay{position:absolute;inset:62px 0 86px;background:#061215dd;display:grid;place-items:center;text-align:center;z-index:4;padding:20px}.panel{max-width:520px}.panel h2{font-size:42px;margin:0 0 10px;color:#f7e9a7}.panel p{color:#b3d0d0;line-height:1.55;margin:0 0 20px}.panel button{background:#edba43;border:0;border-radius:8px;padding:12px 25px;color:#172126;font-weight:900;font-size:16px;cursor:pointer}.panel button:hover{filter:brightness(1.12)}
  @media(max-width:700px){body{padding:0}#game{border-radius:0;min-height:100vh}header{gap:8px;padding:8px;height:54px}h1{font-size:14px}.back{display:none}.stats{gap:9px;font-size:12px}#bottom{padding:8px;gap:6px;min-height:83px}.tower{min-width:0;flex:1;padding:7px;font-size:12px}.tower strong{font-size:12px}.hint{display:none}#wave{padding:9px;font-size:12px}.panel h2{font-size:32px}#overlay{inset:54px 0 83px}}
</style>
</head>
<body>
<main id="game">
  <header><a class="back" href="../index.html">← Games</a><h1>LAST LIGHT DEFENSE</h1><div class="stats"><span class="stat coin">◆ <b id="gold">140</b></span><span class="stat heart">♥ <b id="lives">20</b></span><span class="stat">WAVE <b id="waveNum">0</b></span></div></header>
  <canvas id="field" width="960" height="540"></canvas><div id="enemyLayer" aria-hidden="true"></div>
  <div id="bottom"><button class="tower selected" data-type="arrow"><strong>⌁ Archer <em>50</em></strong><small>Fast, long range</small></button><button class="tower" data-type="cannon"><strong>✹ Cannon <em>80</em></strong><small>Slow splash damage</small></button><button class="tower" data-type="frost"><strong>❄ Frost <em>70</em></strong><small>Slows enemies</small></button><span class="hint" id="hint">Choose a tower, then click grass to build. You can upgrade a tower by clicking it.</span><button id="wave">START WAVE 1</button></div>
  <div id="overlay"><div class="panel"><h2>LAST LIGHT DEFENSE</h2><p>Keep the creatures from reaching the lantern. Build towers beside the road, then survive as long as you can.</p><button id="play">DEFEND THE LIGHT</button></div></div>
</main>
<script>
'use strict';
const c=document.getElementById('field'),x=c.getContext('2d'),goldEl=document.getElementById('gold'),livesEl=document.getElementById('lives'),waveEl=document.getElementById('waveNum'),waveBtn=document.getElementById('wave'),hint=document.getElementById('hint'),overlay=document.getElementById('overlay'),enemyLayer=document.getElementById('enemyLayer');
const W=c.width,H=c.height,path=[[12,270],[130,270],[205,145],[395,145],[470,365],[650,365],[735,205],[990,205]];
let gold,lives,wave,playing,inWave,toSpawn,spawnClock,enemies,towers,shots,particles,selected,last,score;
const specs={arrow:{name:'Archer',cost:50,range:132,rate:.55,damage:13,color:'#f4c14a'},cannon:{name:'Cannon',cost:80,range:108,rate:1.25,damage:34,splash:48,color:'#ed7652'},frost:{name:'Frost',cost:70,range:105,rate:.85,damage:8,slow:1.35,color:'#73dbf2'}};
function reset(){gold=140;lives=20;wave=0;playing=true;inWave=false;toSpawn=0;spawnClock=0;enemies=[];enemyLayer.replaceChildren();towers=[];shots=[];particles=[];selected='arrow';score=0;document.querySelectorAll('.tower').forEach(b=>b.classList.toggle('selected',b.dataset.type===selected));sync();}
function sync(){goldEl.textContent=gold;livesEl.textContent=lives;waveEl.textContent=wave;waveBtn.textContent=inWave?'WAVE IN PROGRESS':`START WAVE ${wave+1}`;waveBtn.disabled=inWave||!playing;document.querySelectorAll('.tower').forEach(b=>b.disabled=gold<specs[b.dataset.type].cost);}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function pointOnPath(progress){let left=progress;for(let i=0;i<path.length-1;i++){let a={x:path[i][0],y:path[i][1]},b={x:path[i+1][0],y:path[i+1]},d=dist(a,b);if(left<=d){let q=left/d;return{x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q,angle:Math.atan2(b.y-a.y,b.x-a.x)}}left-=d}return{x:path.at(-1)[0],y:path.at(-1)[1],angle:0}}
const pathLength=path.slice(1).reduce((s,p,i)=>s+Math.hypot(p[0]-path[i][0],p[1]-path[i][1]),0);
function startWave(){if(inWave||!playing)return;wave++;toSpawn=7+wave*3;inWave=true;spawn();toSpawn--;spawnClock=.65;hint.textContent=`Wave ${wave} is coming! Keep the creatures away from the lantern.`;sync();}
function spawn(){let boss=wave%5===0&&toSpawn===1;let hp=(22+wave*9)*(boss?6:1),startAt=150,start=pointOnPath(startAt),el=document.createElement('i');el.className='enemy-dot'+(boss?' boss':'');el.style.left=start.x/W*100+'%';el.style.top=start.y/H*100+'%';enemyLayer.append(el);enemies.push({p:startAt,x:start.x,y:start.y,hp,maxHp:hp,speed:(43+Math.min(wave*2,30))*(boss?.62:1),r:boss?19:13,reward:boss?45:8+Math.floor(wave/2),color:boss?'#c878ff':wave%3===0?'#ff626d':'#b6ef54',slow:0,dead:false,boss,el});}
function burst(px,py,color,n=9){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=25+Math.random()*90;particles.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.35+Math.random()*.4,color});}}
function update(dt){if(!playing)return;if(inWave){spawnClock-=dt;while(toSpawn&&spawnClock<=0){spawn();toSpawn--;spawnClock+=.65}if(!toSpawn&&!enemies.length){inWave=false;gold+=20+wave*4;hint.textContent=`Wave ${wave} cleared! +${20+wave*4} gold. Get ready for the next one.`;sync();}}
 for(const e of enemies){e.slow=Math.max(0,e.slow-dt);e.p+=e.speed*(e.slow?0.48:1)*dt;let q=pointOnPath(e.p);e.x=q.x;e.y=q.y;e.el.style.left=e.x/W*100+'%';e.el.style.top=e.y/H*100+'%';e.el.classList.toggle('slow',!!e.slow);if(e.p>=pathLength){e.dead=true;e.el.remove();lives--;burst(e.x,e.y,'#ff5a5a',16);if(lives<=0)end(false)}}
 for(const t of towers){t.cool-=dt;if(t.cool>0)continue;let targets=enemies.filter(e=>!e.dead&&dist(t,e)<=t.range).sort((a,b)=>b.p-a.p);let target=targets[0];if(target){t.cool=specs[t.type].rate/(t.level===2?.8:t.level===3?.66:1);t.angle=Math.atan2(target.y-t.y,target.x-t.x);shots.push({x:t.x,y:t.y,target,type:t.type,damage:specs[t.type].damage*(1+(t.level-1)*.55),speed:t.type==='cannon'?225:390,color:specs[t.type].color});}}
 for(let i=shots.length-1;i>=0;i--){let s=shots[i],e=s.target;if(e.dead){shots.splice(i,1);continue}let a=Math.atan2(e.y-s.y,e.x-s.x);s.x+=Math.cos(a)*s.speed*dt;s.y+=Math.sin(a)*s.speed*dt;if(Math.hypot(s.x-e.x,s.y-e.y)<e.r+6){hit(e,s.damage,s.type,s.x,s.y);shots.splice(i,1)}}
 enemies=enemies.filter(e=>!e.dead);for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.91;p.vy*=.91;p.life-=dt;if(p.life<=0)particles.splice(i,1)}sync();}
function hit(e,dmg,type,px,py){if(type==='cannon'){for(const v of enemies)if(!v.dead&&Math.hypot(v.x-px,v.y-py)<specs.cannon.splash)damage(v,dmg*(v===e?1:.55));burst(px,py,'#ed7652',18)}else{damage(e,dmg);if(type==='frost'){e.slow=specs.frost.slow;burst(px,py,'#73dbf2',6)}else burst(px,py,'#f4c14a',5)}}
function damage(e,d){e.hp-=d;if(e.hp<=0&&!e.dead){e.dead=true;e.el.remove();gold+=e.reward;score+=e.reward;burst(e.x,e.y,e.color,e.boss?25:10)}}
function draw(){x.clearRect(0,0,W,H);let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#235446');g.addColorStop(1,'#173b35');x.fillStyle=g;x.fillRect(0,0,W,H);
 x.lineCap='round';x.lineJoin='round';x.strokeStyle='#825a36';x.lineWidth=43;x.beginPath();path.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();x.strokeStyle='#bd9661';x.lineWidth=31;x.beginPath();path.forEach((p,i)=>i?x.lineTo(...p):x.moveTo(...p));x.stroke();
 for(const t of towers){x.save();x.translate(t.x,t.y);x.fillStyle='#18302b';x.beginPath();x.arc(0,0,19,0,6.28);x.fill();x.strokeStyle=specs[t.type].color;x.lineWidth=3;x.stroke();x.rotate(t.angle);x.fillStyle=specs[t.type].color;if(t.type==='arrow'){x.fillRect(0,-4,25,8);x.fillStyle='#e8f6df';x.fillRect(16,-2,14,4)}else if(t.type==='cannon'){x.fillRect(-3,-8,26,16);x.fillStyle='#4d2a25';x.beginPath();x.arc(0,0,10,0,6.28);x.fill()}else{x.fillStyle='#bdf6ff';x.beginPath();x.moveTo(0,-12);x.lineTo(23,0);x.lineTo(0,12);x.closePath();x.fill()}x.restore();if(t.level>1){x.fillStyle='#fff2a3';x.font='bold 12px sans-serif';x.textAlign='center';x.fillText('★'.repeat(t.level-1),t.x,t.y+35)}}
 for(const e of enemies){x.save();x.translate(e.x,e.y);x.fillStyle=e.slow?'#9cf4ff':e.color;x.shadowColor=x.fillStyle;x.shadowBlur=15;x.beginPath();x.arc(0,0,e.r,0,6.28);x.fill();x.shadowBlur=0;x.strokeStyle='#10231d';x.lineWidth=3;x.stroke();x.fillStyle='#15241c';x.beginPath();x.arc(-e.r*.28,-2,2.2,0,6.28);x.arc(e.r*.28,-2,2.2,0,6.28);x.fill();if(e.boss){x.fillStyle='#fff';x.font='14px sans-serif';x.textAlign='center';x.fillText('☠',0,5)}x.restore();let width=e.boss?46:31;x.fillStyle='#291a20';x.fillRect(e.x-width/2,e.y-e.r-12,width,5);x.fillStyle='#82e06b';x.fillRect(e.x-width/2,e.y-e.r-12,width*Math.max(0,e.hp/e.maxHp),5)}
 for(const s of shots){x.fillStyle=s.color;x.shadowColor=s.color;x.shadowBlur=9;x.beginPath();x.arc(s.x,s.y,s.type==='cannon'?5:3,0,6.28);x.fill();x.shadowBlur=0}for(const p of particles){x.globalAlpha=Math.max(0,p.life*1.8);x.fillStyle=p.color;x.fillRect(p.x,p.y,3,3)}x.globalAlpha=1;
 // lantern
 let lx=890,ly=205;x.fillStyle='#54331d';x.fillRect(lx-4,ly-25,8,38);x.fillStyle='#ffe486';x.shadowColor='#ffc84d';x.shadowBlur=25;x.beginPath();x.arc(lx,ly-28,12,0,6.28);x.fill();x.shadowBlur=0;
 if(selected){x.strokeStyle=specs[selected].color+'66';x.lineWidth=1;x.setLineDash([4,6]);x.beginPath();x.arc(mouse.x,mouse.y,specs[selected].range,0,6.28);x.stroke();x.setLineDash([])} }
const mouse={x:0,y:0};function canvasPos(ev){let r=c.getBoundingClientRect(),p=ev.touches?ev.touches[0]:ev;mouse.x=(p.clientX-r.left)*W/r.width;mouse.y=(p.clientY-r.top)*H/r.height}
function onClick(e){canvasPos(e);if(!playing)return;let existing=towers.find(t=>Math.hypot(t.x-mouse.x,t.y-mouse.y)<23);if(existing){let cost=35*existing.level;if(existing.level<3&&gold>=cost){gold-=cost;existing.level++;hint.textContent=`${specs[existing.type].name} upgraded to level ${existing.level}!`;sync()}return}let sp=specs[selected];if(gold<sp.cost)return;let q=pointNearPath(mouse.x,mouse.y);if(q<34){hint.textContent='Towers need grass to stand on — build a little farther from the road.';return}if(mouse.x<30||mouse.x>930||mouse.y<30||mouse.y>510)return;gold-=sp.cost;towers.push({x:mouse.x,y:mouse.y,type:selected,level:1,cool:.1,angle:-1.57,range:sp.range});hint.textContent=`${sp.name} built. Click it later to upgrade.`;sync()}
function pointNearPath(px,py){let best=Infinity;for(let i=0;i<path.length-1;i++){let a={x:path[i][0],y:path[i][1]},b={x:path[i+1][0],y:path[i+1][1]},dx=b.x-a.x,dy=b.y-a.y,t=Math.max(0,Math.min(1,((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy)));best=Math.min(best,Math.hypot(px-(a.x+dx*t),py-(a.y+dy*t)))}return best}
function end(win){playing=false;overlay.style.display='grid';overlay.querySelector('.panel').innerHTML=`<h2>${win?'VICTORY!':'THE LIGHT WENT OUT'}</h2><p>You reached wave ${wave} and earned ${score} enemy gold. ${win?'The valley is safe.':'Build smarter and hold the line longer.'}</p><button onclick="location.reload()">PLAY AGAIN</button>`;sync()}
document.querySelectorAll('.tower').forEach(b=>b.onclick=()=>{selected=b.dataset.type;document.querySelectorAll('.tower').forEach(z=>z.classList.toggle('selected',z===b));});waveBtn.onclick=startWave;document.getElementById('play').onclick=()=>{overlay.style.display='none';reset()};c.addEventListener('pointermove',canvasPos);c.addEventListener('pointerdown',onClick);function tick(){update(.025);draw()}reset();tick();setInterval(tick,25);
</script></body></html>
