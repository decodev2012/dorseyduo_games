<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monster Meadow</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101b2a;color:#f3fbff;font-family:system-ui,sans-serif;padding:16px}#game{width:min(100%,980px);position:relative;border:3px solid #71d19c;border-radius:18px;overflow:hidden;box-shadow:0 22px 70px #0009}canvas{display:block;width:100%;aspect-ratio:16/9}.back{position:absolute;top:12px;left:15px;z-index:2;color:#fff;text-decoration:none;font-weight:800}.hud{position:absolute;top:11px;right:15px;text-align:right;font-weight:900;text-shadow:0 2px 3px #153}.tip{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);background:#102d2ad9;border:2px solid #8bddad;border-radius:12px;padding:8px 16px;font-weight:800;white-space:nowrap}.panel{position:absolute;inset:0;display:grid;place-items:center;background:#071821cf;text-align:center;padding:24px}.panel .box{max-width:530px;background:#123637;border:2px solid #8bddad;border-radius:18px;padding:26px}.panel h1{margin:0;color:#ffe47a;font-size:clamp(34px,7vw,60px)}.panel p{line-height:1.55;color:#d8f2e9}.panel button{border:0;border-radius:10px;padding:13px 25px;background:#ffe47a;color:#17312c;font-weight:900;font-size:16px;cursor:pointer}</style></head><body><main id="game"><a class="back" href="../index.html">← Games</a><div class="hud"><div id="orbs">Capture Orbs: 8</div><div id="caught">Monsters: 0 / 3</div></div><canvas id="c" width="960" height="540"></canvas><div id="tip" class="tip">Explore the tall grass with WASD or arrow keys</div><div id="start" class="panel"><div class="box"><h1>MONSTER MEADOW</h1><p>Explore the meadow, sneak close to wild monsters, and press <b>E</b> to throw a Capture Orb. Time the throw while the ring is bright for the best chance.</p><button>START EXPLORING</button></div></div></main><script>
'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),W=c.width,H=c.height,keys={},tip=document.getElementById('tip'),orbsEl=document.getElementById('orbs'),caughtEl=document.getElementById('caught');let hero,monster,orbs=8,caught=0,live=false,last=0,orb=null,flash=0;const kinds=[['Mosskit','#7de38a'],['Emberbit','#ff8d58'],['Bloopuff','#7ecfff']];
function reset(){hero={x:480,y:300,vx:0,vy:0,face:0};orbs=8;caught=0;orb=null;spawn();sync()}function spawn(){let k=kinds[caught%kinds.length];monster={x:120+Math.random()*720,y:120+Math.random()*290,vx:0,vy:0,name:k[0],color:k[1],mood:Math.random()*6,scared:0}}function sync(){orbsEl.textContent='Capture Orbs: '+orbs;caughtEl.textContent='Monsters: '+caught+' / 3'}function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function throwOrb(){if(!live||orb||orbs<1||dist(hero,monster)>105)return;if(--orbs<0)return;let d=dist(hero,monster),power=Math.max(.16,1-d/130);orb={x:hero.x,y:hero.y,t:0,power,target:monster};tip.textContent='Press SPACE when the ring is bright!';sync()}function capture(){if(!orb)return;let timing=1-Math.min(1,Math.abs(orb.t-.72)/.45),chance=Math.min(.92,.18+orb.power*.5+timing*.32);if(Math.random()<chance){caught++;flash=1;tip.textContent='Caught '+monster.name+'! '+(caught>=3?'You completed the meadow!':'A new monster appeared!');orb=null;if(caught>=3){live=false;setTimeout(()=>{document.getElementById('start').style.display='grid';document.querySelector('.panel h1').textContent='MEADOW COMPLETE!'},900)}else spawn()}else{tip.textContent=monster.name+' escaped! Get closer and try again.';monster.scared=1.5;orb=null}sync()}
function update(dt){if(!live)return;let dx=(keys.a||keys.arrowleft?-1:0)+(keys.d||keys.arrowright?1:0),dy=(keys.w||keys.arrowup?-1:0)+(keys.s||keys.arrowdown?1:0),l=Math.hypot(dx,dy)||1;hero.vx+=(dx/l)*900*dt;hero.vy+=(dy/l)*900*dt;hero.vx*=Math.pow(.8,dt*60);hero.vy*=Math.pow(.8,dt*60);hero.x=Math.max(22,Math.min(W-22,hero.x+hero.vx*dt));hero.y=Math.max(70,Math.min(H-25,hero.y+hero.vy*dt));if(dx||dy)hero.face=Math.atan2(dy,dx);monster.mood+=dt;let away=dist(hero,monster)<90?1:0;if(monster.scared>0||away){let a=Math.atan2(monster.y-hero.y,monster.x-hero.x);monster.vx+=Math.cos(a)*420*dt;monster.vy+=Math.sin(a)*420*dt;monster.scared=Math.max(0,monster.scared-dt)}else{monster.vx+=Math.cos(monster.mood)*35*dt;monster.vy+=Math.sin(monster.mood*.7)*35*dt}monster.vx*=Math.pow(.88,dt*60);monster.vy*=Math.pow(.88,dt*60);monster.x=Math.max(35,Math.min(W-35,monster.x+monster.vx*dt));monster.y=Math.max(90,Math.min(H-35,monster.y+monster.vy*dt));if(orb){orb.t+=dt;orb.x+=((monster.x-orb.x)*5)*dt;orb.y+=((monster.y-orb.y)*5)*dt;if(orb.t>1.3){tip.textContent=monster.name+' dodged it!';orb=null}}else if(dist(hero,monster)<105)tip.textContent='Press E to throw a Capture Orb at '+monster.name;else if(!tip.textContent.includes('Caught'))tip.textContent='Explore the tall grass with WASD or arrow keys';flash=Math.max(0,flash-dt)}
function drawMonster(m){x.save();x.translate(m.x,m.y);let bob=Math.sin(m.mood*4)*3;x.translate(0,bob);x.fillStyle='#1e3e38';x.beginPath();x.ellipse(0,18,25,8,0,0,6.3);x.fill();x.fillStyle=m.color;x.beginPath();x.arc(0,0,22,0,6.3);x.fill();x.fillStyle='#fff';x.beginPath();x.arc(-8,-4,6,0,6.3);x.arc(8,-4,6,0,6.3);x.fill();x.fillStyle='#152b37';x.fillRect(-10,-6,4,6);x.fillRect(6,-6,4,6);x.fillStyle='#fff4b6';x.beginPath();x.moveTo(-14,-16);x.lineTo(-22,-31);x.lineTo(-3,-20);x.fill();x.beginPath();x.moveTo(14,-16);x.lineTo(22,-31);x.lineTo(3,-20);x.fill();x.restore()}
function draw(){let sky=x.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#67c4e0');sky.addColorStop(.45,'#b8efcf');sky.addColorStop(.46,'#4b9e60');sky.addColorStop(1,'#245b46');x.fillStyle=sky;x.fillRect(0,0,W,H);x.fillStyle='#d7f3d0';for(let i=0;i<16;i++){let px=i*70;x.beginPath();x.moveTo(px,205);x.lineTo(px+45,115+(i%3)*25);x.lineTo(px+95,205);x.fill()}x.fillStyle='#368657';x.fillRect(0,235,W,H);for(let i=0;i<120;i++){let px=(i*83)%W,py=245+(i*47)%280;x.strokeStyle=i%3?'#57b36a':'#a3dc75';x.lineWidth=3;x.beginPath();x.moveTo(px,py);x.lineTo(px+Math.sin(i)*5,py-12);x.stroke()}x.fillStyle='#d9c780';x.fillRect(0,365,W,62);x.fillStyle='#b79560';for(let i=0;i<24;i++)x.fillRect(i*47,365+(i%2)*9,28,4);drawMonster(monster);x.save();x.translate(hero.x,hero.y);x.rotate(hero.face);x.fillStyle='#244a9c';x.fillRect(-13,-12,27,28);x.fillStyle='#f3c49f';x.beginPath();x.arc(0,-22,14,0,6.3);x.fill();x.fillStyle='#25324c';x.fillRect(-15,-33,30,7);x.fillStyle='#f5e660';x.fillRect(14,-5,18,6);x.restore();if(orb){x.strokeStyle='#fff3a5';x.lineWidth=5;x.beginPath();x.arc(monster.x,monster.y,30+Math.sin(orb.t*13)*7,0,6.3);x.stroke();x.fillStyle='#fff';x.beginPath();x.arc(orb.x,orb.y,10,0,6.3);x.fill();x.fillStyle='#f04f5a';x.beginPath();x.arc(orb.x,orb.y,10,0,Math.PI);x.fill()}if(flash){x.globalAlpha=flash*.4;x.fillStyle='#fff9a4';x.fillRect(0,0,W,H);x.globalAlpha=1}}
function loop(t){let dt=Math.min(.03,(t-last||t)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}document.querySelector('.panel button').onclick=()=>{document.getElementById('start').style.display='none';reset();live=true};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='e'||e.key==='E')throwOrb();if(e.code==='Space'){e.preventDefault();capture()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);reset();requestAnimationFrame(loop);
</script></body></html>
