<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Night Maze</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#050508;color:#eee;font-family:system-ui,sans-serif;padding:16px}#game{width:min(100%,960px);position:relative;overflow:hidden;border:2px solid #4c214d;border-radius:16px;box-shadow:0 25px 80px #000}canvas{display:block;width:100%;aspect-ratio:16/9}.back{position:absolute;top:12px;left:15px;color:#fff;text-decoration:none;font-weight:800;z-index:3}.hud{position:absolute;top:12px;right:15px;text-align:right;font-weight:800;text-shadow:0 2px 4px #000}.tip{position:absolute;bottom:13px;left:50%;transform:translateX(-50%);background:#150b19e6;border:1px solid #8a4a8b;border-radius:10px;padding:8px 14px;font-weight:800;white-space:nowrap}.cover{position:absolute;inset:0;display:grid;place-items:center;text-align:center;background:#050508d9;padding:22px;z-index:4}.box{max-width:520px;border:1px solid #a15ca2;border-radius:16px;padding:25px;background:#190e22}.box h1{margin:0;color:#e98be8;font-size:clamp(35px,7vw,62px);line-height:.9}.box p{line-height:1.55;color:#dfd1df}.box button{border:0;border-radius:9px;padding:13px 25px;background:#e98be8;color:#260b2c;font-weight:900;font-size:16px;cursor:pointer}</style></head><body><main id="game"><a class="back" href="../index.html">← Games</a><div class="hud" id="hud">FLASHLIGHT: ON<br>KEY: NO</div><canvas id="c" width="960" height="540"></canvas><div id="tip" class="tip">WASD / arrows to move · Find the key</div><div id="cover" class="cover"><div class="box"><h1>NIGHT MAZE</h1><p>Find the <b>key</b>, unlock the exit, and do not let the shadow catch you.<br><br>Use <b>WASD</b> or arrow keys to move. <b>F</b> toggles your flashlight.</p><button id="start">ENTER THE MAZE</button></div></div></main><script>
'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),W=960,H=540,keys={},hud=document.getElementById('hud'),tip=document.getElementById('tip'),cover=document.getElementById('cover'),map=["111111111111111","100000000000001","101111011111101","101000010000101","101011110111101","101010000100001","101010111101101","100010100001001","111110101111101","100000100000001","101111111111101","100000000000001","111111111111111"],MW=15,MH=13;let p,monster,key,hasKey,light,live,last,shake;
function reset(){p={x:1.5,y:1.5,a:0};monster={x:13.3,y:11.3};key={x:7.5,y:5.5};hasKey=false;light=true;shake=0;sync()}function sync(){hud.innerHTML='FLASHLIGHT: '+(light?'ON':'OFF')+'<br>KEY: '+(hasKey?'FOUND':'NO')}function wall(px,py){let ix=Math.floor(px),iy=Math.floor(py);return ix<0||iy<0||ix>=MW||iy>=MH||map[iy][ix]==='1'}function end(win){live=false;cover.style.display='grid';cover.querySelector('h1').textContent=win?'YOU ESCAPED':'IT FOUND YOU';cover.querySelector('p').textContent=win?'The exit door slams shut behind you. You made it out.':'The maze goes quiet. Try again—and keep moving.';document.getElementById('start').textContent='TRY AGAIN'}function move(a,amt){let nx=p.x+Math.cos(p.a+a)*amt,ny=p.y+Math.sin(p.a+a)*amt;if(!wall(nx,p.y))p.x=nx;if(!wall(p.x,ny))p.y=ny}function update(dt){if(!live)return;let turn=(keys.arrowleft||keys.a?-1:0)+(keys.arrowright||keys.d?1:0),forward=(keys.arrowup||keys.w?1:0)+(keys.arrowdown||keys.s?-1:0);p.a+=turn*2.1*dt;if(forward)move(0,forward*2.2*dt);let dx=p.x-monster.x,dy=p.y-monster.y,d=Math.hypot(dx,dy);if(d<8){let sp=light?0.55:1.15,nx=monster.x+dx/d*sp*dt,ny=monster.y+dy/d*sp*dt;if(!wall(nx,monster.y))monster.x=nx;if(!wall(monster.x,ny))monster.y=ny}if(d<.42)end(false);if(!hasKey&&Math.hypot(p.x-key.x,p.y-key.y)<.48){hasKey=true;tip.textContent='You found the key. Get to the glowing exit!';sync()}if(hasKey&&p.x>13&&p.y<2)end(true);shake=Math.max(0,shake-dt)}function ray(a){let d=0;while(d<16){let px=p.x+Math.cos(a)*d,py=p.y+Math.sin(a)*d;if(wall(px,py))return d;d+=.025}return 16}function drawSprite(s,color,size){let dx=s.x-p.x,dy=s.y-p.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-p.a;while(ang>Math.PI)ang-=6.283;while(ang<-Math.PI)ang+=6.283;if(Math.abs(ang)>.75||dist<.15)return;let sx=W/2+Math.tan(ang)*W*.62,sy=H/2,sizePx=size/dist*280;x.fillStyle=color;x.globalAlpha=Math.max(.15,1-dist/11);x.beginPath();x.arc(sx,sy,sizePx,0,6.3);x.fill();x.globalAlpha=1;if(color==='#120916'){x.fillStyle='#ff456b';x.beginPath();x.arc(sx-sizePx*.35,sy-sizePx*.1,sizePx*.14,0,6.3);x.arc(sx+sizePx*.35,sy-sizePx*.1,sizePx*.14,0,6.3);x.fill()}}function draw(){x.fillStyle='#030307';x.fillRect(0,0,W,H);let glow=light?1:.27;x.fillStyle='#11101a';x.fillRect(0,H/2,W,H/2);for(let col=0;col<W;col+=3){let a=p.a+(col/W-.5)*1.45,d=ray(a),h=Math.min(H*1.25,H/(d+.02)*1.1),shade=Math.max(4,Math.min(58,95/d))*glow;x.fillStyle='rgb('+shade+','+Math.floor(shade*.55)+','+shade+')';x.fillRect(col,H/2-h/2,4,h)}if(!hasKey)drawSprite(key,'#ffe168',.18);drawSprite(monster,'#120916',.55);if(hasKey)drawSprite({x:13.5,y:1.5},'#a04bff',.36);x.save();x.translate(W/2,H/2);let g=x.createRadialGradient(0,0,10,0,0,light?300:80);g.addColorStop(0,'#0000');g.addColorStop(.58,'#0000');g.addColorStop(1,light?'#000b':'#000e');x.fillStyle=g;x.fillRect(-W/2,-H/2,W,H);x.restore();if(shake){x.fillStyle='#ff174433';x.fillRect(0,0,W,H)}}function loop(t){let dt=Math.min(.03,(t-last||t)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}document.getElementById('start').onclick=()=>{cover.style.display='none';reset();live=true};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key==='f'||e.key==='F'){light=!light;sync()}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);reset();requestAnimationFrame(loop);
function drawSprite(s,color,size){let dx=s.x-p.x,dy=s.y-p.y,dist=Math.hypot(dx,dy),ang=Math.atan2(dy,dx)-p.a;while(ang>Math.PI)ang-=6.283;while(ang<-Math.PI)ang+=6.283;if(Math.abs(ang)>.75||dist<.15||dist>ray(p.a+ang)+.08)return;let sx=W/2+Math.tan(ang)*W*.62,sy=H/2,sizePx=size/dist*280;x.fillStyle=color;x.globalAlpha=Math.max(.15,1-dist/11);x.beginPath();x.arc(sx,sy,sizePx,0,6.3);x.fill();x.globalAlpha=1;if(color==='#120916'){x.fillStyle='#ff456b';x.beginPath();x.arc(sx-sizePx*.35,sy-sizePx*.1,sizePx*.14,0,6.3);x.arc(sx+sizePx*.35,sy-sizePx*.1,sizePx*.14,0,6.3);x.fill()}}
</script></body></html>
