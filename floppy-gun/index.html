<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Floppy Gun Knockout</title>
  <style>
    :root { color-scheme: dark; --blue:#50cfff; --red:#ff637f; --gold:#ffe56a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:radial-gradient(circle at 50% 0,#28356c 0,transparent 44%),#101226; color:#eef4ff; font-family:ui-rounded,system-ui,sans-serif; padding:16px; }
    #game { width:min(100%,980px); position:relative; overflow:hidden; border:2px solid #4b5e9e; border-radius:20px; background:#1d2450; box-shadow:0 24px 70px #0009; }
    canvas { display:block; width:100%; aspect-ratio:16/9; }
    .back,.menu-open { position:absolute; z-index:5; top:13px; color:#d7e4ff; font-weight:850; font-size:14px; }
    .back { left:16px; text-decoration:none; }
    .back:hover { color:var(--gold); }
    .menu-open { right:15px; border:1px solid #dce7ff66; border-radius:10px; padding:7px 10px; cursor:pointer; background:#172247d9; transition:transform .13s ease,filter .13s ease; }
    .menu-open:hover { transform:translateY(-1px); filter:brightness(1.18); }
    .hud { position:absolute; z-index:2; top:12px; left:0; width:100%; display:flex; justify-content:center; gap:130px; pointer-events:none; font-weight:900; font-size:19px; text-shadow:0 2px 3px #000; }
    .blue { color:#69d7ff; }.red { color:#ff8299; }
    .label { display:block; color:#d1d7ff; font-size:11px; text-align:center; letter-spacing:1px; }
    .controls { position:absolute; z-index:3; bottom:12px; left:0; width:100%; display:flex; justify-content:space-between; padding:0 16px; pointer-events:none; transition:opacity .2s ease; }
    .controls button { pointer-events:auto; border:2px solid #fff6; border-radius:12px; color:#fff; font-weight:900; font-size:20px; padding:9px 22px; cursor:pointer; background:#25316bdd; box-shadow:0 4px 0 #101633; transition:transform .1s ease,filter .1s ease; }
    .controls button:hover { filter:brightness(1.2); transform:translateY(-1px); }
    .controls button:active { transform:translateY(3px); box-shadow:0 1px 0 #101633; }
    .controls .p2 { background:#71314add; }
    .bot-mode #fire2 { display:none; }
    .overlay { position:absolute; z-index:4; inset:0; display:grid; place-items:center; overflow:auto; background:linear-gradient(160deg,#0b0f25ed,#19123be8); padding:24px; }
    .overlay .box { width:min(610px,100%); padding:clamp(20px,4vw,34px); border:1px solid #dbe6ff47; border-radius:24px; background:linear-gradient(145deg,#24336adb,#151b3ede); box-shadow:0 22px 55px #000a,inset 0 1px #fff3; text-align:center; }
    .overlay h1 { margin:0 0 12px; color:var(--gold); font-size:clamp(32px,6vw,56px); line-height:.9; text-shadow:4px 4px #613b86; }
    .overlay p { margin:0 auto 18px; max-width:480px; color:#d7e1ff; line-height:1.48; }
    .section-title { margin:17px 0 8px; color:#aabce8; font-size:11px; font-weight:950; letter-spacing:1.5px; text-align:left; }
    .mode-grid,.difficulty { display:grid; gap:9px; }
    .mode-grid { grid-template-columns:1fr 1fr; }
    .difficulty { grid-template-columns:repeat(3,1fr); }
    .mode-option,.difficulty button { min-height:64px; border:1px solid #b9caff55; border-radius:14px; cursor:pointer; color:#eef4ff; background:#172450d9; font:inherit; font-weight:850; transition:transform .13s ease,border-color .13s ease,background .13s ease,box-shadow .13s ease; }
    .mode-option { padding:11px; text-align:left; }
    .mode-option strong { display:block; color:#fff; font-size:16px; }
    .mode-option small { display:block; margin-top:3px; color:#afc1eb; line-height:1.25; }
    .difficulty button { min-height:46px; padding:8px; font-size:14px; }
    .mode-option:hover,.difficulty button:hover { transform:translateY(-2px); border-color:#e8f0ff; }
    .mode-option.active,.difficulty button.active { border-color:var(--gold); background:linear-gradient(145deg,#464275,#292657); box-shadow:0 0 0 2px #ffe56a33,0 8px 18px #0005; }
    .mode-option.active strong,.difficulty button.active { color:var(--gold); }
    .difficulty[hidden] { display:none; }
    #play { width:min(260px,100%); margin-top:22px; border:0; border-radius:12px; padding:14px 25px; cursor:pointer; color:#172049; background:linear-gradient(#fff192,#ffe05d); box-shadow:0 5px 0 #9c7630,0 12px 25px #0006; font:900 16px ui-rounded,system-ui,sans-serif; transition:transform .1s ease,filter .1s ease; }
    #play:hover { transform:translateY(-2px); filter:brightness(1.06); }
    #play:active { transform:translateY(3px); box-shadow:0 2px 0 #9c7630; }
    @media(max-width:600px) { body { padding:0; } #game { border-radius:0; } .hud { gap:60px; font-size:16px; } .controls button { padding:8px 15px; font-size:16px; } .overlay { padding:13px; } .mode-grid { grid-template-columns:1fr; } .overlay .box { padding:22px; } }
  </style>
</head>
<body>
  <main id="game">
    <a class="back" href="../index.html">← Games</a>
    <button class="menu-open" id="menu" type="button">☰ Menu</button>
    <div class="hud">
      <div class="blue"><span class="label" id="blue-label">BLUE · A D W S</span><b id="blue">0</b></div>
      <div class="red"><span class="label" id="red-label">RED · ← → ↑ ↓</span><b id="red">0</b></div>
    </div>
    <canvas id="c" width="1440" height="810"></canvas>
    <div class="controls"><button id="fire1" type="button">S · FIRE</button><button id="fire2" class="p2" type="button">↓ · FIRE</button></div>
    <section class="overlay" id="overlay" aria-label="Game menu">
      <div class="box">
        <h1>FLOPPY GUN<br>KNOCKOUT</h1>
        <p>A chaotic, original physics brawler. Knock your opponent into the lava!</p>
        <div class="section-title">CHOOSE A MODE</div>
        <div class="mode-grid">
          <button class="mode-option active" type="button" data-mode="two"><strong>2 Players</strong><small>Blue: A/D/W/S · Red: arrow keys</small></button>
          <button class="mode-option" type="button" data-mode="bot"><strong>Vs Bot</strong><small>Play Blue against a rule-based Red bot</small></button>
        </div>
        <div class="difficulty" id="difficulty" hidden>
          <button type="button" data-difficulty="easy">Easy</button>
          <button class="active" type="button" data-difficulty="medium">Medium</button>
          <button type="button" data-difficulty="hard">Hard</button>
        </div>
        <button id="play" type="button">START 2-PLAYER FIGHT</button>
      </div>
    </section>
  </main>

  <script>
    'use strict';
    const c = document.getElementById('c');
    const x = c.getContext('2d');
    const W = 1440, H = 810;
    const PLATS = [
      {x1:350,x2:1090,y:640}, {x1:105,x2:425,y:455}, {x1:1015,x2:1335,y:455},
      {x1:410,x2:630,y:535}, {x1:810,x2:1030,y:535}, {x1:630,x2:810,y:335}
    ];
    const BOT_SETTINGS = {
      easy: {think:.34, fireChance:.28, fireRange:380, aimHeight:70, idealDistance:260, dodgeChance:.24, jumpChance:.18, firePause:.40},
      medium: {think:.17, fireChance:.58, fireRange:530, aimHeight:105, idealDistance:220, dodgeChance:.58, jumpChance:.48, firePause:.18},
      hard: {think:.08, fireChance:.84, fireRange:680, aimHeight:135, idealDistance:180, dodgeChance:.88, jumpChance:.76, firePause:.05}
    };
    const keys = {};
    const game = document.getElementById('game');
    const overlay = document.getElementById('overlay');
    const playButton = document.getElementById('play');
    const difficultyPanel = document.getElementById('difficulty');
    const blueLabel = document.getElementById('blue-label');
    const redLabel = document.getElementById('red-label');
    const blueEl = document.getElementById('blue');
    const redEl = document.getElementById('red');
    const fire2 = document.getElementById('fire2');
    const modeButtons = [...document.querySelectorAll('[data-mode]')];
    const difficultyButtons = [...document.querySelectorAll('[data-difficulty]')];
    let p = [], shots = [], bits = [], live = false, last = 0, blue = 0, red = 0, message = '', msgTimer = 0;
    let mode = 'two', difficulty = 'medium', roundToken = 0;
    const bot = {move:0, think:0, jumpReady:0, fireReady:0};

    function player(px,py,face,color) {
      return {x:px,y:py,vx:0,vy:0,face,turn:face === 1 ? 0 : Math.PI,color,cool:0,invuln:0,knock:0,tilt:0,tiltV:0,run:0,armSwing:0,armSpin:0,gunSwing:0,gunSpin:0,onGround:true,flash:0};
    }
    function updateScore() { blueEl.textContent = blue; redEl.textContent = red; }
    function resetBot() { bot.move = 0; bot.think = .08; bot.jumpReady = 0; bot.fireReady = .15; }
    function reset() {
      p = [player(520,PLATS[3].y,1,'#50cfff'),player(920,PLATS[4].y,-1,'#ff637f')];
      shots = []; bits = []; resetBot(); message = 'FIGHT!'; msgTimer = .8;
    }
    function burst(px,py,color,n = 14) {
      for (let i = 0; i < n; i += 1) {
        const a = Math.random() * 6.28, s = 35 + Math.random() * 150;
        bits.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.5,color});
      }
    }
    function arm(a) {
      const aa = a.turn + a.armSwing + a.tilt;
      return {x:a.x + Math.cos(aa)*48,y:a.y - 74 + Math.sin(aa)*48,a:aa};
    }
    function gun(a) {
      const h = arm(a), ang = h.a + a.gunSwing;
      return {x:h.x + Math.cos(ang)*10,y:h.y + Math.sin(ang)*10,a:ang,tx:h.x + Math.cos(ang)*83,ty:h.y + Math.sin(ang)*83};
    }
    function fire(i) {
      if (!live) return;
      const a = p[i];
      if (!a || a.cool > 0) return;
      const g = gun(a);
      a.cool = .72; a.vx -= a.face * 38;
      shots.push({x:g.tx,y:g.ty,vx:Math.cos(g.a)*680,vy:Math.sin(g.a)*680,owner:i,color:a.color,life:1.3});
      burst(g.tx,g.ty,'#fff3a5',10);
    }
    function jump(i) {
      const a = p[i];
      if (!a || !live || !a.onGround || a.knock > 0) return;
      a.vy = -510; a.onGround = false; burst(a.x,a.y,'#cfeaff',7);
    }
    function hurt(a,face,q) {
      if (a.invuln > 0) return;
      a.invuln = .55; a.knock = .62; a.run = 0; a.vx += face * 430; a.vy = -250; a.tiltV += face * 5.5;
      a.armSpin += face * 18; a.gunSpin += face * 24; a.flash = .18; burst(q.x,q.y,'#fff3a5',22);
    }
    function humanDirection(i) {
      if (i === 0) return (keys.a || keys.A ? -1 : 0) + (keys.d || keys.D ? 1 : 0);
      return (keys.ArrowLeft ? -1 : 0) + (keys.ArrowRight ? 1 : 0);
    }
    function standingPlatform(a) {
      return PLATS.find(z => Math.abs(a.y - z.y) < 8 && a.x > z.x1 && a.x < z.x2);
    }
    function botBrain(dt) {
      if (mode !== 'bot' || !live || !p[0] || !p[1]) return;
      const me = p[1], rival = p[0], cfg = BOT_SETTINGS[difficulty];
      bot.think = Math.max(0,bot.think - dt); bot.jumpReady = Math.max(0,bot.jumpReady - dt); bot.fireReady = Math.max(0,bot.fireReady - dt);
      const incoming = shots.find(q => q.owner === 0 && Math.abs(q.y - (me.y - 68)) < 78 && Math.abs(q.x - me.x) < 295 && Math.sign(q.vx) === Math.sign(me.x - q.x));
      if (incoming && me.onGround && bot.jumpReady <= 0 && Math.random() < cfg.dodgeChance) {
        bot.move = Math.sign(me.x - incoming.x) || 1;
        jump(1); bot.jumpReady = .65 + cfg.think;
      }
      if (bot.think > 0) return;
      bot.think = cfg.think * (.82 + Math.random() * .42);
      const dx = rival.x - me.x, aim = Math.sign(dx) || me.face, distance = Math.abs(dx);
      const support = standingPlatform(me);
      if (!incoming) {
        if (distance > cfg.idealDistance + 42) bot.move = aim;
        else if (distance < cfg.idealDistance - 70) bot.move = -aim;
        else bot.move = Math.random() < .46 ? 0 : aim * (Math.random() < .5 ? 1 : -1);
      }
      if (support && ((bot.move < 0 && me.x < support.x1 + 36) || (bot.move > 0 && me.x > support.x2 - 36))) {
        if (rival.y < me.y - 56 && me.onGround && bot.jumpReady <= 0 && Math.random() < cfg.jumpChance) {
          jump(1); bot.jumpReady = .72;
        } else bot.move = 0;
      }
      if (me.onGround && bot.jumpReady <= 0 && ((rival.y < me.y - 85 && distance < 330) || (incoming && Math.random() < cfg.dodgeChance))) {
        if (Math.random() < cfg.jumpChance) { jump(1); bot.jumpReady = .72; }
      }
      if (distance > 12) me.face = aim;
      if (me.cool <= 0 && bot.fireReady <= 0 && distance < cfg.fireRange && Math.abs(rival.y - me.y) < cfg.aimHeight && Math.random() < cfg.fireChance) {
        fire(1); bot.fireReady = cfg.firePause;
      }
    }
    function control(a,i,dt) {
      const d = i === 1 && mode === 'bot' ? bot.move : humanDirection(i);
      const oldY = a.y;
      if (d) a.face = Math.sign(d);
      const targetTurn = a.face === 1 ? 0 : Math.PI;
      const turnDelta = (targetTurn - a.turn + Math.PI*3) % (Math.PI*2) - Math.PI;
      a.turn += turnDelta * Math.min(1,dt*9);
      a.cool = Math.max(0,a.cool-dt); a.invuln = Math.max(0,a.invuln-dt); a.knock = Math.max(0,a.knock-dt); a.flash = Math.max(0,a.flash-dt);
      if (d && !a.knock) { a.run = Math.min(1,a.run + dt*1.5); a.vx += d * (520 + 1800*a.run) * dt; }
      else a.run = Math.max(0,a.run-dt*3);
      a.vx *= Math.pow(a.knock ? .985 : (d ? .974 : .82),dt*60);
      a.vx = Math.max(-460,Math.min(460,a.vx)); a.vy += 1040*dt; a.x += a.vx*dt; a.y += a.vy*dt;
      if (a.onGround && Math.abs(a.vx) > 250 && Math.random() < dt*34) bits.push({x:a.x-a.vx*.035,y:a.y-3,vx:-a.vx*.18+(Math.random()-.5)*40,vy:-30-Math.random()*80,life:.28,color:a.color});
      a.tilt += a.tiltV*dt; a.tiltV *= Math.pow(.88,dt*60); if (!a.knock) a.tilt *= Math.pow(.72,dt*60); a.tilt = Math.max(-1.25,Math.min(1.25,a.tilt));
      const armTarget = -a.vx*.006 + a.vy*.003 + a.tilt*.65;
      a.armSpin += (armTarget-a.armSwing)*10*dt; a.armSpin *= Math.pow(.93,dt*60); a.armSwing = Math.max(-2.35,Math.min(2.35,a.armSwing+a.armSpin*dt));
      const gunTarget = -a.vx*.003 + a.vy*.0015 + a.tilt*.25;
      a.gunSpin += (gunTarget-a.gunSwing)*11*dt; a.gunSpin *= Math.pow(.9,dt*60); a.gunSwing = Math.max(-1.45,Math.min(1.45,a.gunSwing+a.gunSpin*dt));
      a.onGround = false;
      for (const z of PLATS) if (a.vy >= 0 && oldY <= z.y+3 && a.y >= z.y && a.x > z.x1 && a.x < z.x2) { a.y = z.y; a.vy = 0; a.onGround = true; }
      return a.y > H+80 || a.x < -70 || a.x > W+70;
    }
    function finishRound(loser) {
      if (loser === 0) red += 1; else blue += 1;
      updateScore(); message = loser === 0 ? 'RED KNOCKOUT!' : 'BLUE KNOCKOUT!'; msgTimer = 1; live = false;
      const token = ++roundToken;
      window.setTimeout(() => { if (token !== roundToken || overlay.style.display !== 'none') return; reset(); live = true; },900);
    }
    function update(dt) {
      if (!live) return;
      botBrain(dt);
      for (let i = 0; i < 2; i += 1) if (control(p[i],i,dt)) { finishRound(i); return; }
      for (let i = shots.length - 1; i >= 0; i -= 1) {
        const q = shots[i]; q.x += q.vx*dt; q.y += q.vy*dt; q.life -= dt;
        const b = p[1-q.owner];
        if (q.life <= 0 || q.x < -20 || q.x > W+20 || q.y < -20 || q.y > H+20) { shots.splice(i,1); continue; }
        if (q.x > b.x-24 && q.x < b.x+24 && q.y > b.y-125 && q.y < b.y-4) { hurt(b,p[q.owner].face,q); shots.splice(i,1); }
      }
      for (let i = bits.length - 1; i >= 0; i -= 1) {
        const b = bits[i]; b.x += b.vx*dt; b.y += b.vy*dt; b.vy += 360*dt; b.life -= dt; if (b.life <= 0) bits.splice(i,1);
      }
      msgTimer = Math.max(0,msgTimer-dt); if (!msgTimer) message = '';
    }
    function limb(x1,y1,x2,y2,w,col) {
      x.strokeStyle = '#121a37'; x.lineWidth = w+5; x.lineCap = 'round'; x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke();
      x.strokeStyle = col; x.lineWidth = w; x.beginPath(); x.moveTo(x1,y1); x.lineTo(x2,y2); x.stroke();
    }
    function fighter(a) {
      x.save(); x.translate(a.x,a.y); x.rotate(a.tilt);
      const walk = a.onGround ? Math.min(1,Math.abs(a.vx)/120) : 0;
      const phase = performance.now()/72*Math.sign(a.vx || a.face), step = Math.sin(phase)*13*walk;
      const hip = {x:0,y:-33}, ch = {x:0,y:-74}, head = {x:0,y:-101};
      const foot1 = {x:-11+step,y:-Math.max(0,Math.cos(phase))*8*walk}, foot2 = {x:11-step,y:-Math.max(0,-Math.cos(phase))*8*walk};
      const armAng = a.turn+a.armSwing;
      const elbow = {x:ch.x+Math.cos(armAng)*24+Math.cos(armAng+Math.PI/2)*9,y:ch.y+Math.sin(armAng)*24+Math.sin(armAng+Math.PI/2)*9};
      const hand = {x:ch.x+Math.cos(armAng)*48,y:ch.y+Math.sin(armAng)*48};
      limb(hip.x,hip.y,foot1.x,foot1.y,6,a.color); limb(hip.x,hip.y,foot2.x,foot2.y,6,a.color);
      x.fillStyle = a.color; x.beginPath(); x.moveTo(-13,-73); x.lineTo(13,-73); x.lineTo(11,-35); x.lineTo(-11,-35); x.closePath(); x.fill(); x.strokeStyle = '#121a37'; x.lineWidth = 3; x.stroke();
      x.fillStyle = '#dce8ff'; x.globalAlpha = .3; x.fillRect(-2,-68,4,27); x.globalAlpha = 1;
      limb(ch.x,ch.y,elbow.x,elbow.y,5,a.color); limb(elbow.x,elbow.y,hand.x,hand.y,5,a.color);
      x.fillStyle = '#121a37'; x.beginPath(); x.arc(elbow.x,elbow.y,6,0,6.28); x.fill(); x.fillStyle = a.color; x.beginPath(); x.arc(elbow.x,elbow.y,3,0,6.28); x.fill();
      x.beginPath(); x.arc(hip.x,hip.y,11,0,6.28); x.fill(); x.fillStyle = a.flash ? '#fff' : '#f4c6a3'; x.beginPath(); x.arc(head.x,head.y,16,0,6.28); x.fill(); x.strokeStyle = '#121a37'; x.lineWidth = 3; x.stroke();
      x.fillStyle = '#171d3b'; x.fillRect(-15,-105,30,8); x.fillStyle = '#baf4ff'; x.fillRect(a.face === 1 ? 4 : -12,-103,8,3); x.fillStyle = '#0b1028'; x.fillRect(-10,-117,20,5);
      const gAng = armAng+a.gunSwing;
      x.strokeStyle = '#364674'; x.lineWidth = 3; x.beginPath(); x.moveTo(hand.x,hand.y); x.lineTo(hand.x+Math.cos(gAng)*12,hand.y+Math.sin(gAng)*12); x.stroke();
      x.save(); x.translate(hand.x+Math.cos(gAng)*10,hand.y+Math.sin(gAng)*10); x.rotate(gAng);
      x.fillStyle = '#11172f'; x.fillRect(0,-10,60,20); x.fillStyle = a.color; x.fillRect(8,-6,40,12); x.fillStyle = '#d9e5ff'; x.fillRect(56,-6,25,12); x.fillStyle = '#11172f'; x.fillRect(17,8,14,22); x.fillStyle = '#ffe56a'; x.fillRect(29,-3,12,6); x.strokeStyle = '#070b18'; x.lineWidth = 3; x.strokeRect(0,-10,60,20); x.strokeRect(17,8,14,22); x.restore();
      x.restore();
    }
    function draw() {
      const t = performance.now()/1000, g = x.createLinearGradient(0,0,0,H);
      g.addColorStop(0,'#100c1c'); g.addColorStop(.62,'#3a1720'); g.addColorStop(1,'#7b281c'); x.fillStyle = g; x.fillRect(0,0,W,H);
      x.fillStyle = '#271326';
      for (let i = 0; i < 12; i += 1) { const px = i*145-30; x.beginPath(); x.moveTo(px,0); x.lineTo(px+100,0); x.lineTo(px+55,90+(i%3)*45); x.closePath(); x.fill(); }
      x.fillStyle = '#45202a'; x.fillRect(90,90,170,470); x.fillRect(1140,60,190,510); x.fillStyle = '#ff7c27'; x.globalAlpha = .55; x.fillRect(210,0,18,380); x.fillRect(1190,0,14,330); x.globalAlpha = 1;
      x.fillStyle = '#6e261c'; x.fillRect(0,700,W,110);
      for (let i = 0; i < 18; i += 1) { const py = 715+i*8+Math.sin(t*3+i)*6; x.fillStyle = i%2 ? '#ff6d25' : '#ffb03b'; x.globalAlpha = .55; x.fillRect(0,py,W,4); }
      x.globalAlpha = 1; x.fillStyle = '#271b25';
      for (let i = 0; i < 9; i += 1) { const px = 55+i*170; x.beginPath(); x.moveTo(px,700); x.lineTo(px+42,570+(i%3)*40); x.lineTo(px+84,700); x.closePath(); x.fill(); }
      for (const z of PLATS) { x.fillStyle = '#160f17'; x.fillRect(z.x1+9,z.y+20,z.x2-z.x1,16); x.fillStyle = '#3b3740'; x.fillRect(z.x1,z.y,z.x2-z.x1,20); x.fillStyle = '#ff7834'; x.fillRect(z.x1,z.y,z.x2-z.x1,5); x.fillStyle = '#ffa553'; x.globalAlpha = .35; x.fillRect(z.x1+12,z.y+8,z.x2-z.x1-24,3); x.globalAlpha = 1; }
      for (const b of bits) { x.globalAlpha = Math.max(0,b.life*1.5); x.fillStyle = b.color; x.fillRect(b.x,b.y,4,4); }
      x.globalAlpha = 1;
      for (const q of shots) { x.fillStyle = q.color; x.shadowColor = q.color; x.shadowBlur = 12; x.beginPath(); x.arc(q.x,q.y,7,0,6.28); x.fill(); x.shadowBlur = 0; }
      for (const a of p) fighter(a);
      if (message) { x.font = '900 44px system-ui'; x.textAlign = 'center'; x.strokeStyle = '#471a20'; x.lineWidth = 7; x.strokeText(message,W/2,170); x.fillStyle = '#ffe0a1'; x.fillText(message,W/2,170); }
    }
    function loop(t) { const dt = Math.min(.03,(t-last || t)/1000); last = t; update(dt); draw(); requestAnimationFrame(loop); }
    function syncMenu() {
      game.classList.toggle('bot-mode',mode === 'bot'); difficultyPanel.hidden = mode !== 'bot';
      blueLabel.textContent = 'BLUE · A D W S'; redLabel.textContent = mode === 'bot' ? `RED BOT · ${difficulty.toUpperCase()}` : 'RED · ← → ↑ ↓';
      fire2.disabled = mode === 'bot';
      playButton.textContent = mode === 'bot' ? `START ${difficulty.toUpperCase()} BOT MATCH` : 'START 2-PLAYER FIGHT';
      modeButtons.forEach(button => button.classList.toggle('active',button.dataset.mode === mode));
      difficultyButtons.forEach(button => button.classList.toggle('active',button.dataset.difficulty === difficulty));
    }
    function openMenu() { roundToken += 1; live = false; overlay.style.display = 'grid'; syncMenu(); }
    function startMatch() { roundToken += 1; blue = 0; red = 0; updateScore(); reset(); overlay.style.display = 'none'; syncMenu(); live = true; }
    document.getElementById('menu').addEventListener('click',openMenu);
    playButton.addEventListener('click',startMatch);
    modeButtons.forEach(button => button.addEventListener('click',() => { mode = button.dataset.mode; syncMenu(); }));
    difficultyButtons.forEach(button => button.addEventListener('click',() => { difficulty = button.dataset.difficulty; syncMenu(); }));
    document.getElementById('fire1').addEventListener('click',() => fire(0));
    fire2.addEventListener('click',() => { if (mode === 'two') fire(1); });
    addEventListener('keydown',event => {
      keys[event.key] = true;
      if (event.key === 's' || event.key === 'S') { event.preventDefault(); fire(0); }
      if (event.key === 'w' || event.key === 'W') { event.preventDefault(); jump(0); }
      if (mode === 'two' && event.key === 'ArrowDown') { event.preventDefault(); fire(1); }
      if (mode === 'two' && event.key === 'ArrowUp') { event.preventDefault(); jump(1); }
      if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') event.preventDefault();
    });
    addEventListener('keyup',event => { keys[event.key] = false; });
    updateScore(); syncMenu(); reset(); requestAnimationFrame(loop);
  </script>
</body>
</html>
