<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Floppy Gun Knockout</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#101226;color:#eef4ff;font-family:system-ui,sans-serif;padding:16px}#game{width:min(100%,980px);position:relative;overflow:hidden;border:2px solid #3a477a;border-radius:18px;background:#1d2450;box-shadow:0 24px 70px #0009}canvas{display:block;width:100%;aspect-ratio:16/9}.back{position:absolute;top:13px;left:16px;color:#b9c8ff;text-decoration:none;font-size:14px;z-index:5}.hud{position:absolute;top:12px;left:0;width:100%;display:flex;justify-content:center;gap:130px;pointer-events:none;font-weight:900;font-size:19px;text-shadow:0 2px 3px #000}.blue{color:#69d7ff}.red{color:#ff8299}.label{font-size:11px;color:#d1d7ff;display:block;text-align:center;letter-spacing:1px}.controls{position:absolute;bottom:12px;left:0;width:100%;display:flex;justify-content:space-between;padding:0 16px;pointer-events:none}.controls button{pointer-events:auto;border:2px solid #fff6;border-radius:12px;color:#fff;font-weight:900;font-size:20px;padding:9px 22px;background:#25316bdd}.controls .p2{background:#71314add}.overlay{position:absolute;inset:0;background:#0b0f25cc;display:grid;place-items:center;text-align:center;padding:24px;z-index:4}.overlay .box{max-width:530px}.overlay h1{font-size:clamp(30px,6vw,54px);line-height:.92;margin:0 0 13px;color:#ffe56a;text-shadow:4px 4px #613b86}.overlay p{line-height:1.5;color:#d7e1ff}.overlay button{border:0;border-radius:10px;padding:13px 25px;color:#172049;background:#ffe56a;font-weight:900;font-size:16px;cursor:pointer}@media(max-width:600px){body{padding:0}#game{border-radius:0}.hud{gap:60px;font-size:16px}.controls button{padding:8px 15px;font-size:16px}}</style></head><body>
<main id="game"><a class="back" href="../index.html">← Games</a><div class="hud"><div class="blue"><span class="label">BLUE · A D W S</span><b id="blue">0</b></div><div class="red"><span class="label">RED · ← → ↑ ↓</span><b id="red">0</b></div></div><canvas id="c" width="1440" height="810"></canvas><div class="controls"><button id="fire1">S · FIRE</button><button id="fire2" class="p2">↓ · FIRE</button></div><div class="overlay" id="overlay"><div class="box"><h1>FLOPPY GUN<br>KNOCKOUT</h1><p>A fast, original two-player physics brawler.<br><b>Blue:</b> A/D move · W jump · S fire<br><b>Red:</b> ←/→ move · ↑ jump · ↓ fire</p><button id="play">START FIGHT</button></div></div></main>
<script>
'use strict';const c=document.getElementById('c'),x=c.getContext('2d'),W=1440,H=810,PLATS=[{x1:350,x2:1090,y:640},{x1:105,x2:425,y:455},{x1:1015,x2:1335,y:455},{x1:410,x2:630,y:535},{x1:810,x2:1030,y:535},{x1:630,x2:810,y:335}],keys={};let p=[],shots=[],bits=[],live=false,last=0,blue=0,red=0,message='',msgTimer=0;const blueEl=document.getElementById('blue'),redEl=document.getElementById('red');
function player(px,py,face,color){return{x:px,y:py,vx:0,vy:0,face,turn:face===1?0:Math.PI,color,cool:0,invuln:0,knock:0,tilt:0,tiltV:0,run:0,armSwing:0,armSpin:0,gunSwing:0,gunSpin:0,onGround:true,flash:0}}function reset(){p=[player(520,PLATS[3].y,1,'#50cfff'),player(920,PLATS[4].y,-1,'#ff637f')];shots=[];message='FIGHT!';msgTimer=.8}function burst(px,py,color,n=14){for(let i=0;i<n;i++){let a=Math.random()*6.28,s=35+Math.random()*150;bits.push({x:px,y:py,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.3+Math.random()*.5,color})}}
function arm(a){let aa=a.turn+a.armSwing+a.tilt;return{x:a.x+Math.cos(aa)*48,y:a.y-74+Math.sin(aa)*48,a:aa}}function gun(a){let h=arm(a),ang=h.a+a.gunSwing;return{x:h.x+Math.cos(ang)*10,y:h.y+Math.sin(ang)*10,a:ang,tx:h.x+Math.cos(ang)*83,ty:h.y+Math.sin(ang)*83}}
function fire(i){if(!live)return;let a=p[i];if(a.cool>0)return;let g=gun(a);a.cool=.72;a.vx-=a.face*38;shots.push({x:g.tx,y:g.ty,vx:Math.cos(g.a)*680,vy:Math.sin(g.a)*680,owner:i,color:a.color,life:1.3});burst(g.tx,g.ty,'#fff3a5',10)}function jump(i){let a=p[i];if(!live||!a.onGround||a.knock>0)return;a.vy=-510;a.onGround=false;burst(a.x,a.y,'#cfeaff',7)}
function hurt(a,face,q){if(a.invuln>0)return;a.invuln=.55;a.knock=.62;a.run=0;a.vx+=face*430;a.vy=-250;a.tiltV+=face*5.5;a.armSpin+=face*18;a.gunSpin+=face*24;a.flash=.18;burst(q.x,q.y,'#fff3a5',22)}function control(a,i,dt){let d=i===0?((keys.a||keys.A?-1:0)+(keys.d||keys.D?1:0)):((keys.ArrowLeft?-1:0)+(keys.ArrowRight?1:0)),oldY=a.y;if(d)a.face=Math.sign(d);let targetTurn=a.face===1?0:Math.PI,turnDelta=(targetTurn-a.turn+Math.PI*3)%(Math.PI*2)-Math.PI;a.turn+=turnDelta*Math.min(1,dt*9);a.cool=Math.max(0,a.cool-dt);a.invuln=Math.max(0,a.invuln-dt);a.knock=Math.max(0,a.knock-dt);a.flash=Math.max(0,a.flash-dt);if(d&&!a.knock){a.run=Math.min(1,a.run+dt*1.5);a.vx+=d*(520+1800*a.run)*dt}else a.run=Math.max(0,a.run-dt*3);a.vx*=Math.pow(a.knock?.985:(d?.974:.82),dt*60);a.vx=Math.max(-460,Math.min(460,a.vx));a.vy+=1040*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;if(a.onGround&&Math.abs(a.vx)>250&&Math.random()<dt*34)bits.push({x:a.x-a.vx*.035,y:a.y-3,vx:-a.vx*.18+(Math.random()-.5)*40,vy:-30-Math.random()*80,life:.28,color:a.color});a.tilt+=a.tiltV*dt;a.tiltV*=Math.pow(.88,dt*60);if(!a.knock)a.tilt*=Math.pow(.72,dt*60);a.tilt=Math.max(-1.25,Math.min(1.25,a.tilt));let armTarget=-a.vx*.006+a.vy*.003+a.tilt*.65;a.armSpin+=(armTarget-a.armSwing)*10*dt;a.armSpin*=Math.pow(.93,dt*60);a.armSwing=Math.max(-2.35,Math.min(2.35,a.armSwing+a.armSpin*dt));let gunTarget=-a.vx*.003+a.vy*.0015+a.tilt*.25;a.gunSpin+=(gunTarget-a.gunSwing)*11*dt;a.gunSpin*=Math.pow(.9,dt*60);a.gunSwing=Math.max(-1.45,Math.min(1.45,a.gunSwing+a.gunSpin*dt));a.onGround=false;for(const z of PLATS)if(a.vy>=0&&oldY<=z.y+3&&a.y>=z.y&&a.x>z.x1&&a.x<z.x2){a.y=z.y;a.vy=0;a.onGround=true}if(a.y>H+80||a.x<-70||a.x>W+70)return true;return false}
function update(dt){if(!live)return;for(let i=0;i<2;i++)if(control(p[i],i,dt)){if(i===0)red++;else blue++;blueEl.textContent=blue;redEl.textContent=red;message=i===0?'RED KNOCKOUT!':'BLUE KNOCKOUT!';msgTimer=1;live=false;setTimeout(()=>{reset();live=true},850);return}for(let i=shots.length-1;i>=0;i--){let q=shots[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;let b=p[1-q.owner];if(q.life<=0||q.x<-20||q.x>W+20||q.y<-20||q.y>H+20){shots.splice(i,1);continue}if(q.x>b.x-24&&q.x<b.x+24&&q.y>b.y-125&&q.y<b.y-4){hurt(b,p[q.owner].face,q);shots.splice(i,1)}}for(let i=bits.length-1;i>=0;i--){let b=bits[i];b.x+=b.vx*dt;b.y+=b.vy*dt;b.vy+=360*dt;b.life-=dt;if(b.life<=0)bits.splice(i,1)}msgTimer=Math.max(0,msgTimer-dt);if(!msgTimer)message=''}
function limb(x1,y1,x2,y2,w,col){x.strokeStyle='#121a37';x.lineWidth=w+5;x.lineCap='round';x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.stroke()}function fighter(a){x.save();x.translate(a.x,a.y);x.rotate(a.tilt);let walk=a.onGround?Math.min(1,Math.abs(a.vx)/120):0,phase=performance.now()/72*Math.sign(a.vx||a.face),step=Math.sin(phase)*13*walk,hip={x:0,y:-33},ch={x:0,y:-74},head={x:0,y:-101},foot1={x:-11+step,y:-Math.max(0,Math.cos(phase))*8*walk},foot2={x:11-step,y:-Math.max(0,-Math.cos(phase))*8*walk},armAng=a.turn+a.armSwing,elbow={x:ch.x+Math.cos(armAng)*24+Math.cos(armAng+Math.PI/2)*9,y:ch.y+Math.sin(armAng)*24+Math.sin(armAng+Math.PI/2)*9},hand={x:ch.x+Math.cos(armAng)*48,y:ch.y+Math.sin(armAng)*48};limb(hip.x,hip.y,foot1.x,foot1.y,6,a.color);limb(hip.x,hip.y,foot2.x,foot2.y,6,a.color);x.fillStyle=a.color;x.beginPath();x.moveTo(-13,-73);x.lineTo(13,-73);x.lineTo(11,-35);x.lineTo(-11,-35);x.closePath();x.fill();x.strokeStyle='#121a37';x.lineWidth=3;x.stroke();x.fillStyle='#dce8ff';x.globalAlpha=.3;x.fillRect(-2,-68,4,27);x.globalAlpha=1;limb(ch.x,ch.y,elbow.x,elbow.y,5,a.color);limb(elbow.x,elbow.y,hand.x,hand.y,5,a.color);x.fillStyle='#121a37';x.beginPath();x.arc(elbow.x,elbow.y,6,0,6.28);x.fill();x.fillStyle=a.color;x.beginPath();x.arc(elbow.x,elbow.y,3,0,6.28);x.fill();x.beginPath();x.arc(hip.x,hip.y,11,0,6.28);x.fill();x.fillStyle=a.flash?'#fff':'#f4c6a3';x.beginPath();x.arc(head.x,head.y,16,0,6.28);x.fill();x.strokeStyle='#121a37';x.lineWidth=3;x.stroke();x.fillStyle='#171d3b';x.fillRect(-15,-105,30,8);x.fillStyle='#baf4ff';x.fillRect(a.face===1?4:-12,-103,8,3);x.fillStyle='#0b1028';x.fillRect(-10,-117,20,5);let gAng=armAng+a.gunSwing;x.strokeStyle='#364674';x.lineWidth=3;x.beginPath();x.moveTo(hand.x,hand.y);x.lineTo(hand.x+Math.cos(gAng)*12,hand.y+Math.sin(gAng)*12);x.stroke();x.save();x.translate(hand.x+Math.cos(gAng)*10,hand.y+Math.sin(gAng)*10);x.rotate(gAng);x.fillStyle='#11172f';x.fillRect(0,-10,60,20);x.fillStyle=a.color;x.fillRect(8,-6,40,12);x.fillStyle='#d9e5ff';x.fillRect(56,-6,25,12);x.fillStyle='#11172f';x.fillRect(17,8,14,22);x.fillStyle='#ffe56a';x.fillRect(29,-3,12,6);x.strokeStyle='#070b18';x.lineWidth=3;x.strokeRect(0,-10,60,20);x.strokeRect(17,8,14,22);x.restore();x.restore()}
function draw(){let t=performance.now()/1000,g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#100c1c');g.addColorStop(.62,'#3a1720');g.addColorStop(1,'#7b281c');x.fillStyle=g;x.fillRect(0,0,W,H);x.fillStyle='#271326';for(let i=0;i<12;i++){let px=i*145-30;x.beginPath();x.moveTo(px,0);x.lineTo(px+100,0);x.lineTo(px+55,90+(i%3)*45);x.closePath();x.fill()}x.fillStyle='#45202a';x.fillRect(90,90,170,470);x.fillRect(1140,60,190,510);x.fillStyle='#ff7c27';x.globalAlpha=.55;x.fillRect(210,0,18,380);x.fillRect(1190,0,14,330);x.globalAlpha=1;x.fillStyle='#6e261c';x.fillRect(0,700,W,110);for(let i=0;i<18;i++){let py=715+i*8+Math.sin(t*3+i)*6;x.fillStyle=i%2?'#ff6d25':'#ffb03b';x.globalAlpha=.55;x.fillRect(0,py,W,4)}x.globalAlpha=1;x.fillStyle='#271b25';for(let i=0;i<9;i++){let px=55+i*170;x.beginPath();x.moveTo(px,700);x.lineTo(px+42,570+(i%3)*40);x.lineTo(px+84,700);x.closePath();x.fill()}for(const z of PLATS){x.fillStyle='#160f17';x.fillRect(z.x1+9,z.y+20,z.x2-z.x1,16);x.fillStyle='#3b3740';x.fillRect(z.x1,z.y,z.x2-z.x1,20);x.fillStyle='#ff7834';x.fillRect(z.x1,z.y,z.x2-z.x1,5);x.fillStyle='#ffa553';x.globalAlpha=.35;x.fillRect(z.x1+12,z.y+8,z.x2-z.x1-24,3);x.globalAlpha=1}for(const b of bits){x.globalAlpha=Math.max(0,b.life*1.5);x.fillStyle=b.color;x.fillRect(b.x,b.y,4,4)}x.globalAlpha=1;for(const q of shots){x.fillStyle=q.color;x.shadowColor=q.color;x.shadowBlur=12;x.beginPath();x.arc(q.x,q.y,7,0,6.28);x.fill();x.shadowBlur=0}for(const a of p)fighter(a);if(message){x.font='900 44px system-ui';x.textAlign='center';x.strokeStyle='#471a20';x.lineWidth=7;x.strokeText(message,W/2,170);x.fillStyle='#ffe0a1';x.fillText(message,W/2,170)}}
function loop(t){let dt=Math.min(.03,(t-last||t)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}document.getElementById('play').onclick=()=>{document.getElementById('overlay').style.display='none';reset();live=true};document.getElementById('fire1').onclick=()=>fire(0);document.getElementById('fire2').onclick=()=>fire(1);addEventListener('keydown',e=>{keys[e.key]=true;if(e.key==='s'||e.key==='S'){e.preventDefault();fire(0)}if(e.key==='ArrowDown'){e.preventDefault();fire(1)}if(e.key==='w'||e.key==='W'){e.preventDefault();jump(0)}if(e.key==='ArrowUp'){e.preventDefault();jump(1)}});addEventListener('keyup',e=>keys[e.key]=false);reset();requestAnimationFrame(loop);
</script></body></html>
